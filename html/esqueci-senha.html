<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!-- ajusta a pagina pra telas menores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiri — Redefinir senha</title>

    <!-- fontes usadas na pagina -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Montserrat:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- biblioteca de icnes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* reseta os espacamentos padrao */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* estilo geral da pagina */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9e9d2;
            font-family: 'Montserrat', sans-serif;
            color: #282828;
            padding: 40px 20px;
        }

        /* bloco principal da pagina */
        .cartao {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* logo */
        .logo-quiri {
            width: 190px;
            height: auto;
            display: block;
            margin: 0 auto 25px;
        }

        /* titulo da pagina */
        .titulo {
            width: 100%;
            text-align: center;
            color: #18482d;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* texto de explicacao */
        .texto-explicativo {
            width: 100%;
            text-align: center;
            color: #456854;
            font-size: 0.94rem;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        /* formulario */
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* caixa do campo */
        .caixa-campo {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #282828;
            border-radius: 8px;
            height: 52px;
            padding: 0 16px;
            border: 1.5px solid transparent;
            transition: border-color .2s ease,
                transform .12s ease;
        }

        /* destaca o campo qdo ele esta selecionado */
        .caixa-campo:focus-within {
            border-color: #456854;
        }

        /* icone do campo */
        .caixa-campo i.icone-campo {
            color: #f9e9d2;
            font-size: .95rem;
            width: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        /* campo de entrada */
        .caixa-campo input {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: .74rem;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        /* texto q aparece antes de digitar */
        .caixa-campo input::placeholder {
            color: #d9d4cb;
            opacity: .65;
        }

        /* mensagem de erro */
        .mensagem-erro {
            display: none;
            color: #c0625a;
            margin-top: 5px;
            font-size: 14px;
        }

        /* mostra a mensagem de erro */
        .mensagem-erro.exibir {
            display: block;
        }

        /* botao principal */
        .botao-principal {
            margin-top: 10px;
            height: 54px;
            border: none;
            border-radius: 10px;
            background: #18482d;
            color: #fdf3e6;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: .95rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background .2s ease,
                transform .12s ease,
                box-shadow .2s ease;
        }

        /* efeito do botao qdo passa o mouse */
        .botao-principal:hover {
            background: #103420;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px -8px rgba(16, 52, 32, .6);
        }

        /* efeito do botao qdo clica */
        .botao-principal:active {
            transform: translateY(0);
        }

        /* link pra voltar pro login */
        .link-voltar-login {
            display: table;
            margin: 22px auto 0;
            color: #456854;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            font-size: .65rem;
            transition: color .15s ease;
        }

        /* muda a cor do link qdo passa o mouse */
        .link-voltar-login:hover {
            color: #18482d;
        }

        /* ajustes pra telas menores */
        @media (max-width: 340px) {
            .logo-quiri {
                width: 160px;
            }
        }
    </style>
</head>

<body>

    <!-- conteudo principal da pagina -->
    <main class="cartao">
        <img class="logo-quiri" src="/imagens/logoquiri.png" alt="logo quiri">

        <!-- titulo -->
        <h1 class="titulo">
            Redefinir senha
        </h1>

        <!-- explicacao do q fazer -->
        <p class="texto-explicativo">
            Digite seu e-mail e enviaremos um link para redefinir sua senha.
        </p>

        <!-- formulario de redefinicao -->
        <form id="formRedefinirSenha" autocomplete="on">

            <div class="campo-formulario">
                <label for="email">
                    E-mail
                </label>

                <!-- campo do email -->
                <div class="caixa-campo">
                    <i class="icone-campo fa-solid fa-envelope" aria-hidden="true">
                    </i>

                    <input id="email" name="email" type="email" placeholder="E-MAIL" autocomplete="email" required>
                </div>

                <!-- mensagem de erro do email -->
                <p id="err-email" class="mensagem-erro">
                    Digite um e-mail válido.
                </p>
            </div>

            <!-- envia o pedido de redefinicao -->
            <button type="submit" class="botao-principal">
                Enviar link
            </button>
        </form>

        <!-- volta pra pagina de login -->
        <a class="link-voltar-login" href="index.html">
            Voltar para o login
        </a>
    </main>

    <!-- carrega o js da redefinicao de senha -->
    <script type="module" src="../js/esqueci-senha.js"></script>

</body>

</html>
