<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <!-- ajusta a pagina pra telas menores -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiri — Login</title>

  <!-- fontes usadas na pagina -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Montserrat:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- biblioteca de icones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* reseta os espacamentos padrao */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* estilo geral da pagina */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9e9d2;
      font-family: 'Montserrat', sans-serif;
      color: #282828;
      padding: 40px 20px;
    }

    /* organiza o formulario de login */
    .cartao-principal {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* logo */
    .logo-quiri {
      width: 190px;
      height: auto;
      display: block;
      margin: 0 auto 2px;
    }

    /* frase abaixo da logo */
    .frase-destaque {
      font-family: 'Caveat', cursive;
      font-weight: 600;
      font-size: 1.55rem;
      color: #456854;
      text-align: center;
      margin-bottom: 34px;
      letter-spacing: .01em;
    }

    /* formulario */
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* caixa dos campos */
    .caixa-campo {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #282828;
      border-radius: 8px;
      height: 52px;
      padding: 0 16px;
      border: 1.5px solid transparent;
      transition: border-color .2s ease, transform .12s ease;
    }

    /* destaca o campo qdo ele esta selecionado */
    .caixa-campo:focus-within {
      border-color: #456854;
    }

    /* icone dos campos */
    .caixa-campo i.icone-campo {
      color: #f9e9d2;
      font-size: .95rem;
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }

    /* campos de entrada */
    .caixa-campo input {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: .74rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    /* texto q aparece antes de digitar */
    .caixa-campo input::placeholder {
      color: #d9d4cb;
      opacity: .65;
    }

    /* botao de mostrar ou esconder senha */
    .alternar-senha {
      background: none;
      border: none;
      color: #f9e9d2;
      opacity: .75;
      font-size: .9rem;
      cursor: pointer;
      padding: 6px;
      flex-shrink: 0;
      transition: opacity .15s ease;
    }

    /* efeito do botao da senha */
    .alternar-senha:hover {
      opacity: 1;
    }

    /* linha com opcoes do login */
    .linha-opcoes {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 0;
      font-size: .7rem;
      letter-spacing: .04em;
    }

    /* mensagem de erro */
    .mensagem-erro {
      display: none;
      color: #c0625a;
      margin-top: 5px;
      font-size: 14px;
    }

    /* mostra a mensagem de erro */
    .mensagem-erro.exibir {
      display: block;
    }

    /* destaca o campo com erro */
    .campo-com-erro {
      border: 1px solid #c0625a !important;
    }

    /* link de esqueci a senha */
    .link-recuperar-senha {
      display: table;
      margin: 0 auto;
      color: #456854;
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: .65rem;
      transition: color .15s ease;
    }

    /* efeito do link qdo passa o mouse */
    .link-recuperar-senha:hover {
      color: #18482d;
      border-color: #456854;
    }

    /* botao principal */
    .botao-principal {
      margin-top: 10px;
      height: 54px;
      border: none;
      border-radius: 10px;
      background: #18482d;
      color: #fdf3e6;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: .95rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s ease, transform .12s ease, box-shadow .2s ease;
    }

    /* efeito do botao qdo passa o mouse */
    .botao-principal:hover {
      background: #103420;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px -8px rgba(16, 52, 32, .6);
    }

    /* efeito do botao qdo clica */
    .botao-principal:active {
      transform: translateY(0);
    }

    /* separador */
    .divisor {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 32px 0 22px;
    }

    /* linha do separador */
    .divisor::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: #7b947a;
      opacity: .35;
    }

    /* conteudo do separador */
    .divisor span {
      position: relative;
      background: #f9e9d2;
      padding: 0 16px;
      font-family: 'Caveat', cursive;
      font-weight: 600;
      font-size: 1.25rem;
      color: #456854;
    }

    /* texto de cadastro */
    .link-cadastro {
      text-align: center;
      font-size: .78rem;
      color: #456854;
      letter-spacing: .02em;
    }

    /* link de cadastro */
    .link-cadastro a {
      color: #18482d;
      font-weight: 800;
      text-decoration: none;
      border-bottom: 1.5px solid #7b947a;
      transition: border-color .15s ease;
    }

    /* efeito do link de cadastro */
    .link-cadastro a:hover {
      border-color: #18482d;
    }

    /* ajustes pra telas menores */
    @media (max-width:340px) {
      .logo-quiri {
        width: 160px;
      }

      .frase-destaque {
        font-size: 1.35rem;
      }
    }

    /* destaque de acessibilidade ao navegar pelo teclado */
    :focus-visible {
      outline: 2px solid #456854;
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <main class="cartao-principal">

    <!-- logo -->
    <img class="logo-quiri" src="/imagens/logoquiri.png" alt="logo quiri">

    <!-- frase debaixo da logo -->
    <p class="frase-destaque">A melhor ferramenta para você!</p>

    <!-- formulario de login -->
    <form id="formLogin" autocomplete="on">

      <!-- campo login -->
      <div class="campo-formulario">
        <div class="caixa-campo">
          <i class="icone-campo fa-solid fa-envelope" aria-hidden="true"></i>

          <input id="login" name="login" type="text" placeholder="E-MAIL" required>
        </div>
      </div>

      <!-- campo senha -->
      <div class="campo-formulario">
        <div class="caixa-campo">
          <i class="icone-campo fa-solid fa-lock"></i>

          <input id="password" name="password" type="password" placeholder="SENHA" autocomplete="current-password"
            required>

          <!-- botao pra mostrar ou esconder a senha -->
          <button type="button" class="alternar-senha" id="togglePass">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>

        <!-- mensagem de erro do login -->
        <p id="err-login" class="mensagem-erro">
          E-mail ou senha incorretos.
        </p>
      </div>

      <!-- link pra recuperar a senha -->
      <a class="link-recuperar-senha" href="esqueci-senha.html">Esqueceu a senha?</a>

      <!-- envia o formulario -->
      <button type="submit" class="botao-principal">
        Entrar
      </button>
    </form>

    <!-- separador da tela -->
    <div class="divisor">
      <span></span>
    </div>

    <!-- link pra criar uma conta -->
    <p class="link-cadastro">
      Não tem conta?
      <a href="cadastro.html">Cadastre-se</a>
    </p>

  </main>

  <script>

    // pega os elementos do formulario
    const formularioLogin = document.getElementById("formLogin");
    const campoLogin = document.getElementById("login");
    const campoSenha = document.getElementById("password");
    const mensagemErro = document.getElementById("err-login");

    // pega o botao q mostra e esconde a senha
    const toggle = document.getElementById("togglePass");

    // alterna a visualizacao da senha
    toggle.addEventListener("click", function () {
      const isHidden = campoSenha.type === "password";

      campoSenha.type = isHidden ? "text" : "password";

      toggle.setAttribute(
        "aria-pressed",
        String(isHidden)
      );

      toggle.setAttribute(
        "aria-label",
        isHidden ? "Ocultar senha" : "Mostrar senha"
      );

      toggle.innerHTML = isHidden
        ? '<i class="fa-solid fa-eye-slash" aria-hidden="true"></i>'
        : '<i class="fa-solid fa-eye" aria-hidden="true"></i>';
    });

    // envia o login pro back
    formularioLogin.addEventListener("submit", async function (evento) {

      // impede q a página seja recarregada
      evento.preventDefault();

      const email = campoLogin.value.trim();
      const senha = campoSenha.value;

      // limpa a mensagem de erro anterior
      mensagemErro.classList.remove("exibir");

      campoLogin.parentElement.classList.remove("campo-com-erro");
      campoSenha.parentElement.classList.remove("campo-com-erro");

      try {

        // envia os dados pra a rota de login
        const resposta = await fetch("/api/nutricionista/login", {
          method: "POST",

          // informa q os dados estao sendo enviados em json
          headers: {
            "Content-Type": "application/json"
          },

          // envia email e senha pro back
          body: JSON.stringify({
            email: email,
            senha: senha
          })
        });

        // recebe a resposta do backend
        const resultado = await resposta.json();

        // verifica se o backend retornou erro
        if (!resposta.ok) {

          mensagemErro.textContent =
            resultado.mensagem || "E-mail ou senha incorretos.";

          mensagemErro.classList.add("exibir");

          campoLogin.parentElement.classList.add("campo-com-erro");
          campoSenha.parentElement.classList.add("campo-com-erro");

          return;
        }

        // salva o uid da nutricionista q fez login
        localStorage.setItem(
          "uidNutricionista",
          resultado.uid
        );

        // vai direto pra o dashboard
        window.location.href = "dashboard.html";

      } catch (erro) {
        // mostra erro qnd nao consegue conectar com o servidor
        console.error("Erro ao fazer login:", erro);

        mensagemErro.textContent =
          "Erro ao conectar com o servidor.";

        mensagemErro.classList.add("exibir");
      }
    });

  </script>
</body>

</html>
